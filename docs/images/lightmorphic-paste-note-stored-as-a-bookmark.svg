<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" role="img"
     aria-label="A note pulled apart: the bookmark's name is the note's name, and the text of the note is stored inside the bookmark's web address.">
  <style>
    .ink { fill: none; stroke: #17171c; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .thin { fill: none; stroke: #17171c; stroke-width: 1.2; stroke-linecap: round; opacity: .5; }
    .mark { fill: #fbc711; }
    .paper { fill: #ffffff; }
    .t { font: 13px 'Iowan Old Style', Palatino, Georgia, serif; fill: #17171c; }
    .lbl { font: 10px ui-monospace, Menlo, monospace; fill: #56545f; letter-spacing: .1em; }
    .code { font: 11px ui-monospace, Menlo, monospace; fill: #17171c; }
    @media (prefers-color-scheme: dark) {
      .ink, .thin { stroke: #f1eee4; } .paper { fill: #1b1b23; }
      .t, .code { fill: #f1eee4; } .lbl { fill: #a5a2ae; }
    }
  </style>

  <g transform="translate(20 26)">
    <rect class="paper" x="0" y="0" width="290" height="52" rx="6"/>
    <rect class="ink" x="0" y="0" width="290" height="52" rx="6"/>
    <path class="mark" d="M16 16h10v22l-5-5-5 5z"/>
    <text class="t" x="38" y="31">Email address</text>
    <text class="lbl" x="38" y="45">AN ORDINARY BOOKMARK</text>
  </g>

  <path class="thin" d="M120 86v22M232 86v52"/>
  <path class="ink" d="M118 104l2 6 2-6"/>
  <path class="ink" d="M230 134l2 6 2-6"/>

  <g transform="translate(20 122)">
    <text class="lbl" x="0" y="0">ITS NAME</text>
    <text class="t" x="0" y="22">is what you see in the list</text>
  </g>

  <g transform="translate(20 172)">
    <text class="lbl" x="0" y="0">ITS WEB ADDRESS</text>
    <rect class="paper" x="0" y="10" width="600" height="34" rx="4"/>
    <rect class="thin" x="0" y="10" width="600" height="34" rx="4"/>
    <text class="code" x="12" y="32">https://lightmorphic.invalid/#pm1:%7B%22c%22%3A%22alex%40example.com%22%7D</text>
    <path class="mark" d="M232 15h330v24H232z" opacity=".35"/>
    <text class="lbl" x="232" y="60">THE NOTE ITSELF LIVES IN HERE</text>
  </g>
</svg>
