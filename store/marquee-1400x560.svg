<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" width="1400" height="560">
  <rect width="1400" height="560" fill="#f6f3ec"/>

  <!-- ribbons bleeding off the top edge, the site's own motif -->
  <g>
    <path d="M1188 0h26v88l-13-11-13 11z" fill="#fbc711"/>
    <path d="M1224 0h26v64l-13-9-13 9z" fill="#7fb2a6"/>
    <path d="M1260 0h26v112l-13-14-13 14z" fill="#d98a6a"/>
    <path d="M1296 0h26v74l-13-10-13 10z" fill="#8f8bc4"/>
  </g>

  <!-- the mark and the name -->
  <rect x="96" y="86" width="42" height="42" rx="11" fill="#111827"/>
  <rect x="106" y="97" width="16" height="5.5" rx="2.7" fill="#fbc711"/>
  <rect x="106" y="107" width="23" height="5.5" rx="2.7" fill="#fbc711"/>
  <rect x="106" y="117" width="12" height="5.5" rx="2.7" fill="#fbc711"/>
  <text x="152" y="117" font-family="system-ui, -apple-system, sans-serif"
        font-weight="700" font-size="25" fill="#17171c">Pastemorphic</text>

  <!-- the line -->
  <g font-family="'Iowan Old Style', Palatino, Georgia, serif" fill="#17171c">
    <text x="96" y="268" font-size="57">The lines you paste all the time,</text>
    <text x="96" y="338" font-size="57">kept in your bookmarks.</text>
  </g>

  <g font-family="'Iowan Old Style', Palatino, Georgia, serif" fill="#56545f" font-size="25">
    <text x="96" y="404">Click one to copy it, or drop it straight into the box you were typing in.</text>
  </g>

  <text x="96" y="486" font-family="ui-monospace, Menlo, monospace" font-size="15"
        letter-spacing="3.4" fill="#56545f">NO ACCOUNT · NO SERVER · FREE SOFTWARE</text>

  <!-- a few notes suggested at the right, kept simple at this size -->
  <g transform="translate(1010 168)">
    <rect x="0" y="0" width="300" height="58" rx="12" fill="#ffffff" stroke="#ddd6c7"/>
    <rect x="20" y="17" width="120" height="9" rx="4.5" fill="#17171c"/>
    <rect x="20" y="34" width="176" height="8" rx="4" fill="#c9c3b4"/>
    <rect x="222" y="20" width="60" height="18" rx="9" fill="#fbc711"/>

    <rect x="0" y="72" width="300" height="58" rx="12" fill="#ffffff" stroke="#ddd6c7"/>
    <rect x="20" y="89" width="92" height="9" rx="4.5" fill="#17171c"/>
    <rect x="20" y="106" width="150" height="8" rx="4" fill="#c9c3b4"/>
    <rect x="222" y="92" width="60" height="18" rx="9" fill="#fbc711"/>

    <rect x="0" y="144" width="300" height="58" rx="12" fill="#ffffff" stroke="#ddd6c7"/>
    <rect x="20" y="161" width="138" height="9" rx="4.5" fill="#17171c"/>
    <rect x="20" y="178" width="110" height="8" rx="4" fill="#c9c3b4"/>
  </g>
</svg>
