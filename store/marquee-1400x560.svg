<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" width="1400" height="560">
  <defs>
    <radialGradient id="glow" cx="76%" cy="42%" r="52%">
      <stop offset="0%"  stop-color="#fbc711" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#fbc711" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#fbc711" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1400" height="560" fill="#0b0b0f"/>
  <rect width="1400" height="560" fill="url(#glow)"/>

  <!-- mark and name -->
  <rect x="96" y="76" width="40" height="40" rx="11" fill="#fbc711"/>
  <rect x="105" y="86"  width="15" height="5" rx="2.5" fill="#111827"/>
  <rect x="105" y="95"  width="22" height="5" rx="2.5" fill="#111827"/>
  <rect x="105" y="104" width="11" height="5" rx="2.5" fill="#111827"/>
  <text x="150" y="104" font-family="Manrope" font-weight="800" font-size="23"
        fill="#fafafa" letter-spacing="-0.4">Lightmorphic Paste</text>

  <!-- the line -->
  <text x="96" y="252" font-family="Manrope" font-weight="800" font-size="66"
        fill="#fafafa" letter-spacing="-2.4">Stop retyping</text>
  <text x="96" y="332" font-family="Manrope" font-weight="800" font-size="66"
        fill="#fbc711" letter-spacing="-2.4">the same lines.</text>

  <text x="96" y="396" font-family="Manrope" font-weight="500" font-size="24"
        fill="#a1a1aa">Every note is an ordinary bookmark, so they follow you</text>
  <text x="96" y="430" font-family="Manrope" font-weight="500" font-size="24"
        fill="#a1a1aa">between computers. No account. No server.</text>

  <text x="96" y="492" font-family="Manrope" font-weight="700" font-size="14"
        fill="#6b6b76" letter-spacing="3">FREE · OPEN SOURCE · NOTHING LEAVES YOUR BROWSER</text>

  <!-- the stack of notes, with one lifting out towards a field -->
  <g transform="translate(872 112)">
    <rect x="34" y="196" width="352" height="66" rx="16" fill="#16171f" stroke="url(#cardEdge)"/>
    <rect x="58" y="219" width="118" height="10" rx="5" fill="#6f7180"/>
    <rect x="58" y="239" width="176" height="9" rx="4.5" fill="#3a3c47"/>

    <rect x="20" y="112" width="366" height="70" rx="16" fill="#1b1d29" stroke="url(#cardEdge)"/>
    <rect x="46" y="136" width="132" height="11" rx="5.5" fill="#c9cbd6"/>
    <rect x="46" y="158" width="196" height="9" rx="4.5" fill="#54566a"/>
    <rect x="300" y="138" width="62" height="22" rx="11" fill="#3a2f06"/>
    <rect x="309" y="146" width="44" height="6" rx="3" fill="#fbc711"/>

    <!-- the one being taken -->
    <g transform="translate(-14 -6) rotate(-3.4 190 40)" filter="url(#lift)">
      <rect x="0" y="0" width="380" height="76" rx="18" fill="#21232f" stroke="#fbc711" stroke-opacity="0.5"/>
      <rect x="28" y="24" width="150" height="12" rx="6" fill="#fafafa"/>
      <rect x="28" y="48" width="212" height="10" rx="5" fill="#8a8c9c"/>
      <rect x="296" y="26" width="62" height="24" rx="12" fill="#fbc711"/>
    </g>
  </g>

  <g transform="translate(920 402)">
    <rect x="0" y="0" width="380" height="64" rx="15" fill="#0e0f16" stroke="#33353f"/>
    <rect x="24" y="28" width="164" height="9" rx="4.5" fill="#fbc711"/>
    <rect x="196" y="20" width="2.5" height="25" rx="1.2" fill="#fafafa"/>
  </g>
</svg>
