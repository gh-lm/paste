      <rect x="26" y="22" width="136" height="11" rx="5.5" fill="#fafafa"/>
      <rect x="26" y="44" width="192" height="9" rx="4.5" fill="#8a8c9c"/>
      <rect x="266" y="24" width="56" height="22" rx="11" fill="#fbc711"/>
    </g>
  </g>

  <g transform="translate(796 448)">
    <rect x="0" y="0" width="344" height="58" rx="14" fill="#0e0f16" stroke="#33353f"/>
    <rect x="22" y="25" width="148" height="8" rx="4" fill="#fbc711"/>
    <rect x="178" y="18" width="2.5" height="22" rx="1.2" fill="#fafafa"/>
