    <text x="80" y="416">were typing in. Every note is an ordinary bookmark,</text>
    <text x="80" y="450">so they follow you between computers.</text>
  </g>

  <text x="80" y="700" font-family="ui-monospace, Menlo, monospace" font-size="13"
