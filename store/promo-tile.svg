<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 280" width="440" height="280">
  <defs>
    <radialGradient id="glow" cx="82%" cy="24%" r="66%">
      <stop offset="0%" stop-color="#fbc711" stop-opacity="0.20"/>
      <stop offset="65%" stop-color="#fbc711" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#fbc711" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="440" height="280" fill="#0b0b0f"/>
  <rect width="440" height="280" fill="url(#glow)"/>

  <rect x="32" y="28" width="30" height="30" rx="8" fill="#fbc711"/>
  <rect x="39" y="35" width="11" height="4" rx="2" fill="#111827"/>
  <rect x="39" y="42" width="16" height="4" rx="2" fill="#111827"/>
  <rect x="39" y="49" width="8"  height="4" rx="2" fill="#111827"/>
  <text x="72" y="49" font-family="Manrope" font-weight="800" font-size="17"
        fill="#fafafa" letter-spacing="-0.3">Lightmorphic Paste</text>

  <text x="32" y="130" font-family="Manrope" font-weight="800" font-size="34"
        fill="#fafafa" letter-spacing="-1.3">Stop retyping</text>
  <text x="32" y="170" font-family="Manrope" font-weight="800" font-size="34"
        fill="#fbc711" letter-spacing="-1.3">the same lines.</text>

  <text x="32" y="204" font-family="Manrope" font-weight="500" font-size="14.5"
        fill="#a1a1aa">Kept in your bookmarks, so they follow you.</text>

  <text x="32" y="248" font-family="Manrope" font-weight="700" font-size="10"
        fill="#6b6b76" letter-spacing="2">FREE · OPEN SOURCE · NO ACCOUNT</text>

  <!-- two notes, the top one lifted, both kept inside the canvas -->
  <g transform="translate(296 74) rotate(-4 56 22)">
    <rect x="0" y="0" width="112" height="44" rx="11" fill="#21232f"
          stroke="#fbc711" stroke-opacity="0.45"/>
    <rect x="14" y="13" width="46" height="6.5" rx="3.2" fill="#fafafa"/>
    <rect x="14" y="27" width="66" height="5.5" rx="2.7" fill="#8a8c9c"/>
    <rect x="84" y="14" width="16" height="12" rx="6" fill="#fbc711"/>
  </g>
  <g transform="translate(304 130)">
    <rect x="0" y="0" width="112" height="42" rx="11" fill="#16171f" stroke="url(#edge)"/>
    <rect x="14" y="13" width="38" height="6.5" rx="3.2" fill="#6f7180"/>
    <rect x="14" y="26" width="58" height="5.5" rx="2.7" fill="#3a3c47"/>
  </g>
</svg>
